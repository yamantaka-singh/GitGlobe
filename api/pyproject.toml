[project]
name = "gitglobe-api"
version = "0.1.0"
description = "GitGlobe Search API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "qdrant-client>=1.9.0",
    "voyageai>=0.2.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
