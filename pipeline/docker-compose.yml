# Local Postgres for Phase 1. Port 5433 on purpose — 5432 is almost always
# already taken by something else, and the resulting "connection refused to the
# wrong database" is a genuinely confusing hour to lose.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gitglobe-postgres
    environment:
      POSTGRES_USER: gitglobe
      POSTGRES_PASSWORD: gitglobe
      POSTGRES_DB: gitglobe
    ports:
      - "5433:5432"
    volumes:
      - gitglobe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitglobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: gitglobe-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - gitglobe-qdrantdata:/qdrant/storage
    healthcheck:
      # The image ships no wget, curl or nc, so the original check could only
      # ever fail — the container reported "unhealthy" for its whole life while
      # serving traffic fine, which meant a genuinely sick Qdrant would have
      # looked exactly the same. bash is present and `/dev/tcp` is a builtin,
      # so this needs nothing installed. CMD-SHELL runs via /bin/sh, and
      # /dev/tcp is bash-only, so this must invoke bash explicitly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gitglobe-redis
    ports:
      - "6379:6379"
    volumes:
      - gitglobe-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gitglobe-pgdata:
  gitglobe-qdrantdata:
  gitglobe-redisdata:
