[project]
name = "gitglobe-pipeline"
version = "0.1.0"
description = "GitGlobe ingest — GitHub repositories to embeddable capability text"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "prefect>=3.0",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gitglobe = "gitglobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitglobe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
