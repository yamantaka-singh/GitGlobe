[project]
name = "gitglobe-pipeline"
version = "0.1.0"
description = "GitGlobe ingest — GitHub repositories to embeddable capability text"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "prefect>=3.0",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.2",
    # Phase 2. umap-learn pulls numba and llvmlite, which is why it is worth
    # keeping the CPU projection a separate, re-runnable stage rather than
    # something the ingest imports.
    "numpy>=1.26",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gitglobe = "gitglobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitglobe"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Power of 10 rule 10: compile with every warning on, and fix every warning.
# In C that means -Wall -Werror. Here it means selecting more than ruff's
# default handful and treating the result as a gate, not a suggestion.
#
# `PLR0915` (too many statements) and `C901` (complexity) are the closest
# automatic checks to rule 4, but `tests/test_power_of_ten.py` is the one that
# enforces it — a lint rule cannot hold a written justification, and an
# exception without a reason is how a standard rots.
[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes — unused names, undefined names
    "B",           # bugbear — mutable defaults, unused loop vars, silent bugs
    "SIM",         # simplifiable constructs
    "C4",          # comprehension misuse
    "RET",         # inconsistent returns (rule 7: check every return)
    "ARG",         # unused arguments — usually a signature that drifted
    "PTH",         # os.path where pathlib belongs
    "RUF",         # ruff's own correctness checks
    "PLR0915",     # too many statements
    "C901",        # cyclomatic complexity
]
ignore = [
    "E501",        # line length is already set above; the formatter owns it
    "B008",        # function call in default arg — intentional for np defaults
    "RET504",      # named return values are often the clearer read
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct broken inputs and poke at internals.
"tests/*" = ["ARG", "PLR0915", "C901", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
